<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出産前後 パパアプリ</title>
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <!-- ログイン / 新規登録 画面 -->
    <div id="auth">
        <h1>出産前後 パパアプリ</h1>
        <p class="lead">夫が「いつ・何をすべきか」で迷わないためのアプリ。</p>

        <!-- 新規登録のときだけ表示する項目 -->
        <div id="signup-fields" hidden>
            <div class="modes">
                <button type="button" data-mode="new" class="on">新しく家族を作る</button>
                <button type="button" data-mode="join">相手として参加</button>
            </div>

            <label>役割</label>
            <select id="f-role">
                <option value="husband">夫</option>
                <option value="wife">妻</option>
            </select>
            <label>お名前</label>
            <input id="f-name" placeholder="太郎">

            <div id="new-household-fields">
                <label>家族の名前</label>
                <input id="f-household" placeholder="山田家">
            </div>

            <div id="join-household-fields" hidden>
                <label>招待コード（相手から共有してもらう）</label>
                <input id="f-invite" placeholder="ABC123">
            </div>
        </div>

        <label>メールアドレス</label>
        <input id="f-email" type="email" placeholder="you@example.com">
        <label>パスワード</label>
        <input id="f-password" type="password" placeholder="password">

        <div class="err" id="auth-err"></div>
        <button class="btn" id="btn-submit">ログイン</button>
        <div class="switch" id="toggle-auth">新規登録はこちら</div>
    </div>

    <!-- アプリ本体（ログイン後に表示）-->
    <div id="app" hidden>
        <div class="phone">
            <div class="screen">
                <!-- 段取り -->
                <section class="view active" id="v-prep">
                    <div class="hd">
                        <h2>🗒 妊娠後期・準備</h2>
                        <p class="sub">やること</p>
                        <p class="sub" id="invite-info"></p>
                        <button class="signout" data-signout>ログアウト</button>
                    </div>
                    <div class="body">
                        <div class="list" id="prep-list"></div>
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <input id="prep-new" placeholder="新しい項目を入力">
                            <button class="btn" id="prep-add"
                                style="width:auto; padding:0 16px; margin-top:0;">追加</button>
                        </div>

                        <p class="sec" style="margin-top:18px;">🎁 Push Gift 候補</p>
                        <div id="gift-list"></div>
                        <div class="gift-form">
                            <input id="gift-title" placeholder="商品名">
                            <input id="gift-price" type="number" step="1" min="0" placeholder="価格（円・数字のみ）">
                            <input id="gift-url" placeholder="商品ページのURL">
                            <button class="btn" id="gift-add"
                                style="width:auto; padding:0 16px; margin-top:0;">追加</button>
                        </div>
                    </div>
                </section>
                <!-- 当日（陣痛タイマーは次で動かします）-->
                <section class="view" id="v-day">
                    <div class="hd">
                        <h2>⏱ 陣痛モード</h2>
                        <p class="sub" id="clock">--:--</p>
                    </div>
                    <div class="body">
                        <div class="timer">
                            <p class="sub">前回からの経過</p>
                            <p class="big" id="tm-main">00:00</p>
                            <button class="btn-big" id="tm-btn">▶ 陣痛が来た（記録）</button>
                            <button class="tm-reset" id="tm-reset">リセット（新しく計測）</button>
                        </div>
                        <div class="stats">
                            <div class="stat">
                                <p class="k">平均間隔</p>
                                <p class="v" id="st-int">—</p>
                            </div>
                            <div class="stat">
                                <p class="k">記録回数</p>
                                <p class="v" id="st-cnt">0回</p>
                            </div>
                        </div>
                        <div class="banner mute" id="alert">「陣痛が来た」を押すと間隔を計測します</div>
                        <p class="sec">当日やること</p>
                        <div class="list" id="day-list"></div>
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <input id="day-new" placeholder="新しい項目を入力">
                            <button class="btn" id="day-add"
                                style="width:auto; padding:0 16px; margin-top:0;">追加</button>
                        </div>
                    </div>
                </section>
                <!-- 手続き -->
                <section class="view" id="v-doc">
                    <div class="hd">
                        <h2>📄 出産手続き</h2>
                        <p class="sub">届出リスト</p>
                    </div>
                    <div class="body">
                        <div id="doc-list"></div>
                    </div>
                </section>
                <!-- お金・記録（バックエンドはこれから）-->
                <section class="view" id="v-money">
                    <div class="hd">
                        <h2>💰 育休・給付金</h2>
                        <p class="sub" style="margin-top:8px;">産後8週の28日間は</p>
                        <p style="margin:2px 0 0; font-size:20px; font-weight:600; color:var(--accent);">手取り 実質10割</p>
                        <p style="margin:3px 0 0; font-size:11px; color:var(--hint);">夫婦とも14日以上の育休が条件</p>
                    </div>
                    <div class="body" id="money-list"></div>
                </section>
                <section class="view" id="v-log">
                    <div class="hd">
                        <h2>📓 育児記録</h2>
                    </div>
                    <div class="body">
                        <div class="empty">近日対応</div>
                    </div>
                </section>
            </div>
            <nav class="tabs">
                <button class="tab on" data-v="v-prep"><span class="ic">🗒</span>段取り</button>
                <button class="tab" data-v="v-day"><span class="ic">⏱</span>当日</button>
                <button class="tab" data-v="v-doc"><span class="ic">📄</span>手続き</button>
                <button class="tab" data-v="v-money"><span class="ic">💰</span>お金</button>
                <button class="tab" data-v="v-log"><span class="ic">📓</span>記録</button>
            </nav>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
